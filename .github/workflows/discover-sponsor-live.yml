name: Sponsor Live Discovery

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-live-discovery-v2
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Discover fresh YouTube and TikTok sponsor inventory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORDB_API_KEY: ${{ secrets.CREATORDB_API_KEY }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '60' }}
          CREATORDB_PAGE_SIZE: ${{ vars.CREATORDB_PAGE_SIZE || '50' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
          ENABLE_TIKTOK_SPONSOR_SCAN: 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Hard wall-clock cap: live APIs may be slow, but verified backlog delivery
          # must never wait indefinitely for them.
          timeout --signal=TERM --kill-after=30s 8m python src/run_sponsor_discovery_multisource.py || {
            status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "Live discovery hit its 8-minute cap; preserving any queue progress and continuing."
            else
              echo "Live discovery returned status $status; preserving existing verified inventory and continuing."
            fi
          }
      - name: Persist newly discovered queue inventory
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/sponsor_queue.json; then
            echo "Live discovery produced no queue change."
            exit 0
          fi
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json
          git commit -m "Top up live sponsor discovery inventory [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
