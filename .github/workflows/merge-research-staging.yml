name: Merge Research Discovery Staging

on:
  push:
    paths:
      - 'data/research_discovery_staging_*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-research-discovery-staging
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge staged researched sponsors safely
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os, re
          from difflib import SequenceMatcher
          from pathlib import Path
          from urllib.parse import urlencode, urlparse
          from urllib.request import urlopen

          researched_path = Path('data/researched_sponsors.json')
          sent_path = Path('data/sent_sponsor_keys.json')
          researched = json.loads(researched_path.read_text()) if researched_path.exists() else []
          sent = set(json.loads(sent_path.read_text())) if sent_path.exists() else set()
          youtube_key = (os.getenv('YOUTUBE_API_KEY') or '').strip()

          def key_text(value):
              return re.sub(r'[^a-z0-9]+', '', (value or '').lower())

          def youtube_id(url):
              value = str(url or '').strip()
              m = re.search(r'(?:youtube\.com/watch\?v=|youtu\.be/)([A-Za-z0-9_-]{6,})', value)
              return m.group(1) if m else ''

          def direct_social_id(item):
              platform = str(item.get('source_platform') or '').strip().lower()
              url = str(item.get('video_url') or item.get('source_url') or item.get('post_url') or '').strip()
              parsed = urlparse(url)
              host = parsed.netloc.lower()
              if platform == 'tiktok' and 'tiktok.com' in host:
                  m = re.search(r'/video/(\d+)', parsed.path)
                  return m.group(1) if m else ''
              if platform == 'instagram' and 'instagram.com' in host:
                  parts = [part for part in parsed.path.split('/') if part]
                  if len(parts) >= 2 and parts[-2] in {'reel', 'reels', 'p'}:
                      return parts[-1]
              return ''

          def resolve_youtube_video(item):
              if youtube_id(item.get('video_url')):
                  item['source_platform'] = 'YouTube'
                  item['video_id'] = youtube_id(item.get('video_url'))
                  return True
              channel_id = str(item.get('creator_channel_id') or '').strip()
              title = str(item.get('video_title') or '').strip()
              if not youtube_key or not channel_id or not title:
                  return False
              params = urlencode({
                  'part': 'snippet', 'channelId': channel_id, 'q': title,
                  'type': 'video', 'maxResults': 10, 'order': 'date', 'key': youtube_key,
              })
              try:
                  with urlopen('https://www.googleapis.com/youtube/v3/search?' + params, timeout=20) as response:
                      payload = json.load(response)
              except Exception as exc:
                  print(f'YouTube resolution failed for {item.get("brand_name")}: {exc}')
                  return False
              target = key_text(title)
              candidates = []
              for row in payload.get('items', []):
                  vid = str((row.get('id') or {}).get('videoId') or '').strip()
                  found_title = str((row.get('snippet') or {}).get('title') or '').strip()
                  if vid and found_title:
                      candidates.append((SequenceMatcher(None, target, key_text(found_title)).ratio(), vid, found_title))
              if not candidates:
                  return False
              score, vid, found_title = max(candidates)
              if score < 0.72:
                  print(f'YouTube title match too weak for {item.get("brand_name")}: {score:.2f} / {found_title}')
                  return False
              item['source_platform'] = 'YouTube'
              item['video_url'] = f'https://www.youtube.com/watch?v={vid}'
              item['video_id'] = vid
              print(f'Resolved YouTube video for {item.get("brand_name")}: {found_title} / {vid}')
              return True

          def validate_direct_creator_evidence(item):
              platform = str(item.get('source_platform') or 'YouTube').strip().lower()
              if platform == 'youtube':
                  return resolve_youtube_video(item)
              if platform in {'tiktok', 'instagram'}:
                  cid = direct_social_id(item)
                  if not cid:
                      return False
                  item['video_url'] = str(item.get('video_url') or item.get('source_url') or item.get('post_url') or '').strip()
                  item['video_id'] = cid
                  item['source_platform'] = platform.title()
                  return True
              return False

          existing_brands = {key_text(x.get('brand_name')) for x in researched if isinstance(x, dict)}
          existing_domains = {str(x.get('brand_domain') or '').lower().strip() for x in researched if isinstance(x, dict)}

          added = 0
          for filename in sorted(glob.glob('data/research_discovery_staging_*.json')):
              try:
                  items = json.loads(Path(filename).read_text())
              except Exception:
                  continue
              if not isinstance(items, list):
                  continue
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  brand = key_text(item.get('brand_name'))
                  domain = str(item.get('brand_domain') or '').lower().strip()
                  if not brand or not domain:
                      continue
                  if brand in existing_brands or domain in existing_domains:
                      continue
                  if f'brand:{brand}' in sent or f'domain:{domain}' in sent:
                      continue
                  if not validate_direct_creator_evidence(item):
                      print(f'Skipped staged sponsor without valid direct creator evidence: {item.get("brand_name")}')
                      continue
                  researched.append(item)
                  existing_brands.add(brand)
                  existing_domains.add(domain)
                  added += 1

          researched_path.write_text(json.dumps(researched, indent=2, ensure_ascii=False) + '\n')
          for filename in glob.glob('data/research_discovery_staging_*.json'):
              Path(filename).unlink(missing_ok=True)
          print(f'Added {added} verified researched sponsors.')
          PY
      - name: Persist merge
        shell: bash
        run: |
          git config user.name "sponsor-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/researched_sponsors.json data/research_discovery_staging_*.json || true
          if git diff --cached --quiet; then
            echo "No research changes to persist."
            exit 0
          fi
          git commit -m "Merge verified sponsor research staging [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
