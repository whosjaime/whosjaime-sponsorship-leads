name: Creatomap Live Smoke Test

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe public Creatomap API
        run: |
          python - <<'PY'
          import json
          import requests

          base = "https://creatomap.com/api"
          headers = {"User-Agent": "SponsorLeadScanner/1.0", "Accept": "application/json"}

          r = requests.get(f"{base}/brands", params={"category": "gaming", "limit": 5}, headers=headers, timeout=20)
          print("BRANDS_STATUS", r.status_code)
          print("BRANDS_CONTENT_TYPE", r.headers.get("content-type"))
          print("BRANDS_BODY", r.text[:3000])
          r.raise_for_status()
          payload = r.json()

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          slug = ""
          for obj in walk(payload):
              candidate = obj.get("slug") or obj.get("brand_slug") or obj.get("brandSlug")
              if candidate:
                  slug = str(candidate)
                  print("FOUND_BRAND", obj.get("name") or obj.get("title"), slug)
                  break

          if not slug:
              raise RuntimeError("Creatomap /api/brands returned JSON but no brand slug was found")

          d = requests.get(f"{base}/brands/{slug}", headers=headers, timeout=20)
          print("DETAIL_STATUS", d.status_code)
          print("DETAIL_CONTENT_TYPE", d.headers.get("content-type"))
          print("DETAIL_BODY", d.text[:5000])
          d.raise_for_status()
          d.json()
          PY
