name: Force Sponsor Now

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: force-sponsor-now
  cancel-in-progress: false

jobs:
  send:
    if: startsWith(github.event.issue.title, 'FORCE SPONSOR NOW')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send one balanced sponsor to Monday then Discord
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '60' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
          SPONSOR_DAILY_TIMEZONE: ${{ vars.SPONSOR_DAILY_TIMEZONE || 'America/Toronto' }}
          SPONSOR_DAILY_TARGET: '24'
          SPONSOR_YOUTUBE_DAILY_TARGET: '8'
          SPONSOR_TIKTOK_DAILY_TARGET: '8'
          SPONSOR_INSTAGRAM_DAILY_TARGET: '8'
        run: python src/run_sponsor_daily_dispatch.py
      - name: Persist sponsor state
        if: always()
        shell: bash
        run: |
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json data/sent_sponsor_keys.json data/sponsor_delivery_pending.json
          if git diff --cached --quiet; then
            echo "No sponsor state changes."
            exit 0
          fi
          git commit -m "Force balanced sponsor delivery state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
