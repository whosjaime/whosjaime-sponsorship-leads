name: Deliver Verified Sponsors

on:
  workflow_run:
    workflows:
      - Merge Sponsor Discovery Candidates
      - Merge Discovery Staging
      - Merge Discovery Durable
      - Merge Discovery Extra
      - Merge Discovery PR
      - Merge Inline Sponsor Discovery
      - Merge Research Staging
      - Sponsor Queue Top-Up
    types: [completed]
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-backlog-drain
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Deliver up to 24 verified sponsors daily to Monday and Discord
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORDB_API_KEY: ${{ secrets.CREATORDB_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '60' }}
          CREATORDB_PAGE_SIZE: ${{ vars.CREATORDB_PAGE_SIZE || '50' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
          ENABLE_TIKTOK_SPONSOR_SCAN: 'true'
          SPONSOR_DAILY_TARGET: '24'
          SPONSOR_YOUTUBE_DAILY_TARGET: '8'
          SPONSOR_TIKTOK_DAILY_TARGET: '8'
          SPONSOR_INSTAGRAM_DAILY_TARGET: '8'
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 24); do
            today_count=$(python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from sponsor_queue import load_sent_keys
          from sponsor_daily_policy import total_delivered_today
          print(total_delivered_today(load_sent_keys()))
          PY
          )

            if [ "$today_count" -ge 24 ]; then
              echo "Daily target reached: $today_count/24"
              break
            fi

            if [ ! -s data/sponsor_queue.json ] || [ "$(cat data/sponsor_queue.json)" = "[]" ]; then
              echo "Queue empty at $today_count/24; topping up before next delivery."
              python src/run_sponsor_daily_topup.py
            fi

            before="$today_count"
            python src/run_sponsor_daily_dispatch.py
            after=$(python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from sponsor_queue import load_sent_keys
          from sponsor_daily_policy import total_delivered_today
          print(total_delivered_today(load_sent_keys()))
          PY
          )

            if [ "$after" -le "$before" ]; then
              echo "No delivery progress after dispatch; run one fresh top-up and retry once."
              python src/run_sponsor_daily_topup.py
              python src/run_sponsor_daily_dispatch.py
              after_retry=$(python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from sponsor_queue import load_sent_keys
          from sponsor_daily_policy import total_delivered_today
          print(total_delivered_today(load_sent_keys()))
          PY
          )
              if [ "$after_retry" -le "$before" ]; then
                echo "No additional verified sponsor available right now; preserving state for next scheduled run."
                break
              fi
            fi
          done

          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from sponsor_queue import load_sent_keys
          from sponsor_daily_policy import delivery_counts, total_delivered_today
          keys = load_sent_keys()
          counts = delivery_counts(keys)
          print(
              f"DAILY DELIVERY STATUS: {total_delivered_today(keys)}/24 | "
              f"YouTube={counts.get('youtube',0)} | TikTok={counts.get('tiktok',0)} | "
              f"Instagram={counts.get('instagram',0)}"
          )
          PY

      - name: Persist sponsor delivery state
        if: always()
        shell: bash
        run: |
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json data/sent_sponsor_keys.json data/sponsor_delivery_pending.json
          if git diff --cached --quiet; then
            echo "No sponsor delivery state changes."
            exit 0
          fi
          git commit -m "Deliver daily sponsor batch to Monday and Discord [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
