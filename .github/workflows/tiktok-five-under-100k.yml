name: TikTok Five Under 100K

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: tiktok-five-under-100k
  cancel-in-progress: false

jobs:
  send-five:
    if: startsWith(github.event.issue.title, 'SEND 5 TIKTOK UNDER 100K')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send five verified TikTok sponsors under 100K followers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '60' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
        run: python src/run_tiktok_five_under_100k.py
      - name: Persist sent sponsor ledger
        if: always()
        shell: bash
        run: |
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent_sponsor_keys.json
          if git diff --cached --quiet; then
            echo "No sponsor ledger changes."
            exit 0
          fi
          git commit -m "Persist TikTok under-100K sponsor sends [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
