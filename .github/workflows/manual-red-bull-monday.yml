name: Manual Red Bull Monday Lead

on:
  push:
    branches:
      - main
    paths:
      - "src/run_manual_red_bull_monday.py"
      - ".github/workflows/manual-red-bull-monday.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-red-bull-monday
  cancel-in-progress: true

jobs:
  import-red-bull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Create Red Bull Monday lead
        env:
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
        run: python src/run_manual_red_bull_monday.py
      - name: Persist duplicate ledger and result
        if: always()
        run: |
          if git status --porcelain -- data/sent_sponsor_keys.json data/manual_red_bull_result.json | grep -q .; then
            git config user.name "sponsor-queue-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/sent_sponsor_keys.json data/manual_red_bull_result.json
            git commit -m "Record manual Red Bull Monday lead [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No Red Bull state changes to persist."
          fi
