name: Bootstrap Sponsor Duplicate Ledger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sponsor-duplicate-bootstrap-trigger"

permissions:
  contents: write

concurrency:
  group: sponsor-lead-queue
  cancel-in-progress: false

jobs:
  bootstrap-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Copy historical Monday brands into GitHub duplicate ledger once
        env:
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
        run: python src/bootstrap_sponsor_duplicate_ledger.py
      - name: Persist bootstrapped GitHub duplicate ledger
        run: |
          if git diff --quiet -- data/sent_sponsor_keys.json; then
            echo "Sponsor duplicate ledger already contained current history."
            exit 0
          fi
          git config user.name "sponsor-duplicate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent_sponsor_keys.json
          git commit -m "Bootstrap sponsor duplicate history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
