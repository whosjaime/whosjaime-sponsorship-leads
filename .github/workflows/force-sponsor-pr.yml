name: Force Sponsor Delivery via PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: force-sponsor-pr
  cancel-in-progress: false

jobs:
  deliver:
    if: startsWith(github.event.pull_request.title, 'FORCE SPONSOR DELIVERY')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Deliver one real queued sponsor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '60' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
        run: python src/run_sponsor_queue_dispatch.py
      - name: Persist sponsor delivery state
        run: |
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json data/sent_sponsor_keys.json data/sponsor_delivery_pending.json
          if git diff --cached --quiet; then
            echo "ERROR: dispatcher produced no state change"
            exit 1
          fi
          git commit -m "Persist forced sponsor delivery [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
