name: Hourly Sponsor Queue Dispatch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sponsor-dispatch-trigger"

permissions:
  contents: write

concurrency:
  group: sponsor-queue-dispatch
  cancel-in-progress: false

jobs:
  dispatch-sponsor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Ensure sponsor queue has a qualified candidate
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORDB_API_KEY: ${{ secrets.CREATORDB_API_KEY }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
          CREATORDB_PAGE_SIZE: ${{ vars.SPONSOR_CREATORDB_PAGE_SIZE || vars.CREATORDB_PAGE_SIZE || '50' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
        shell: bash
        run: |
          if [ -s data/sponsor_delivery_pending.json ] && [ "$(cat data/sponsor_delivery_pending.json)" != "{}" ]; then
            echo "Pending delivery checkpoint exists; skipping queue rebuild so Discord retry can resume safely."
          elif [ ! -s data/sponsor_queue.json ] || [ "$(cat data/sponsor_queue.json)" = "[]" ]; then
            echo "Sponsor queue empty; rebuilding from researched inventory/discovery before dispatch."
            python src/run_sponsor_discovery_batch.py
          else
            echo "Sponsor queue already has candidates."
          fi
      - name: Deliver next qualified queued sponsor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
        run: python src/run_sponsor_queue_dispatch.py
      - name: Persist sponsor delivery state
        if: always()
        run: |
          if git diff --quiet -- data/sponsor_queue.json data/sent_sponsor_keys.json data/sponsor_delivery_pending.json; then
            echo "Sponsor delivery state unchanged."
            exit 0
          fi
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json data/sent_sponsor_keys.json data/sponsor_delivery_pending.json
          git commit -m "Persist sponsor delivery state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
