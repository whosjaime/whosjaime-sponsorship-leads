name: Hourly Sponsor Queue Dispatch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sponsor-dispatch-trigger"
      - ".github/sponsor-batch-trigger"

permissions:
  contents: write

concurrency:
  group: sponsor-lead-queue
  cancel-in-progress: false

jobs:
  dispatch-sponsor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deliver next qualified queued sponsor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
        run: python src/run_sponsor_queue_dispatch.py
      - name: Persist sponsor queue and permanent sent ledger
        if: always()
        run: |
          if git diff --quiet -- data/sponsor_queue.json data/sent_sponsor_keys.json; then
            echo "Sponsor queue and sent ledger unchanged."
            exit 0
          fi
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json data/sent_sponsor_keys.json
          git commit -m "Persist sponsor queue and sent ledger [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
