name: Hourly Sponsor Lead Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target_leads:
        description: Maximum NEW sponsor companies to add this run
        required: true
        default: "1"
      min_lead_score:
        description: Minimum lead quality score
        required: true
        default: "70"
  push:
    branches:
      - main
    paths:
      - ".github/sponsor-scan-trigger"

concurrency:
  group: sponsor-lead-scanner
  cancel-in-progress: false

jobs:
  scan-sponsors:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scan public sponsorships and import NEW leads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORDB_API_KEY: ${{ secrets.CREATORDB_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          # Scheduled runs are ALWAYS capped at one new brand, even if an old variable still says 20.
          SPONSOR_TARGET_DAILY_LEADS: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.target_leads || '1' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ github.event.inputs.min_lead_score || vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
          CREATORDB_PAGE_SIZE: ${{ vars.CREATORDB_PAGE_SIZE || '50' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
          ENABLE_INSTAGRAM_SPONSOR_SCAN: ${{ vars.ENABLE_INSTAGRAM_SPONSOR_SCAN || 'false' }}
          ENABLE_TIKTOK_SPONSOR_SCAN: ${{ vars.ENABLE_TIKTOK_SPONSOR_SCAN || 'false' }}
        shell: bash
        run: |
          set -o pipefail
          python src/run_sponsor_scan.py | tee sponsor_scan.log
          if grep -Eq 'WARNING: (YouTube active sponsor scan failed|monday create failed|Discord new lead notification failed)' sponsor_scan.log; then
            echo "Critical sponsor scanner warning detected; failing this run so Discord can alert us."
            exit 1
          fi
      - name: Tell Discord when a successful scan finds zero new leads
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_SCAN_LOG: sponsor_scan.log
        run: python src/discord_scan_zero_status.py
      - name: Alert Discord if sponsor scanner breaks
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python src/discord_scan_failure_alert.py
