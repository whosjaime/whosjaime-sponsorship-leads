name: Discord Test

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  discord-test:
    if: startsWith(github.event.issue.title, 'RUN DISCORD TEST')
    runs-on: ubuntu-latest
    steps:
      - name: Send labeled Discord test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is missing"
            exit 1
          fi
          payload='{"content":"🧪 **TEST SPONSOR MESSAGE**\nThis is a test from the sponsorship pipeline. No Monday.com item was created and this is not a real sponsor lead."}'
          code=$(curl -sS -o /tmp/discord_test_response.txt -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL")
          echo "Discord HTTP status: $code"
          cat /tmp/discord_test_response.txt || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi

  force-sponsor:
    if: startsWith(github.event.issue.title, 'FORCE REAL SPONSOR')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run production sponsor dispatcher
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
        run: python src/run_sponsor_queue_dispatch.py
      - name: Persist sponsor state
        if: always()
        shell: bash
        run: |
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json data/sent_sponsor_keys.json data/sponsor_delivery_pending.json
          if git diff --cached --quiet; then
            echo "No sponsor state changes."
            exit 0
          fi
          git commit -m "Persist forced sponsor delivery [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
