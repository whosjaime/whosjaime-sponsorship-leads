name: Sponsor Queue Top-Up

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sponsor-batch-trigger"

permissions:
  contents: write

concurrency:
  group: sponsor-queue-topup
  cancel-in-progress: true

jobs:
  build-sponsor-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Top up and diversify sponsor queue
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORDB_API_KEY: ${{ secrets.CREATORDB_API_KEY }}
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
          CREATORDB_PAGE_SIZE: ${{ vars.CREATORDB_PAGE_SIZE || '50' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
          ENABLE_TIKTOK_SPONSOR_SCAN: 'true'
        shell: bash
        run: |
          set -o pipefail
          # run_sponsor_discovery_batch.py remains the YouTube-first engine called by the multisource runner.
          python src/run_sponsor_discovery_multisource.py | tee sponsor_batch.log
      - name: Persist refreshed sponsor queue
        run: |
          if git diff --quiet -- data/sponsor_queue.json; then
            echo "Sponsor queue unchanged."
            exit 0
          fi
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json
          git commit -m "Refresh sponsor queue [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
