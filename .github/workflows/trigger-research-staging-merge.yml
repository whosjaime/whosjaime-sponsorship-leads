name: Trigger Research Staging Merge

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: read

jobs:
  dispatch-merge:
    if: startsWith(github.event.issue.title, 'RUN RESEARCH STAGING MERGE')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch safe research staging merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merge-research-staging.yml --repo "${{ github.repository }}"
