name: Cancel Old Social Push

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: read

jobs:
  cancel:
    if: startsWith(github.event.issue.title, 'CANCEL OLD SOCIAL PUSH')
    runs-on: ubuntu-latest
    steps:
      - name: Cancel broad sponsor runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 33827254339 --repo "${{ github.repository }}" || true
          gh run cancel 33828715141 --repo "${{ github.repository }}" || true
