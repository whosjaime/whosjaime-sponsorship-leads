name: Merge Sponsor Discovery Candidates

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: sponsor-discovery-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'MERGE SPONSOR DISCOVERY CANDIDATES')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'MERGE SPONSOR DISCOVERY CANDIDATES'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge verified candidates without losing existing inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          researched_path = Path('data/researched_sponsors.json')
          batch_path = Path('data/discovery_candidate_batch.json')
          sent_path = Path('data/sent_sponsor_keys.json')

          researched = json.loads(researched_path.read_text(encoding='utf-8')) if researched_path.exists() else []
          batch = json.loads(batch_path.read_text(encoding='utf-8')) if batch_path.exists() else []
          sent = json.loads(sent_path.read_text(encoding='utf-8')) if sent_path.exists() else []

          def norm(value):
              return ''.join(ch for ch in (value or '').lower() if ch.isalnum())

          existing_brands = {norm(x.get('brand_name')) for x in researched}
          existing_domains = {norm(x.get('brand_domain')) for x in researched}
          sent_norm = {norm(x) for x in sent}

          added = []
          for lead in batch:
              brand = norm(lead.get('brand_name'))
              domain = norm(lead.get('brand_domain'))
              if not brand or not domain:
                  continue
              if brand in existing_brands or domain in existing_domains:
                  continue
              if norm('brand:' + lead.get('brand_name','')) in sent_norm or norm('domain:' + lead.get('brand_domain','')) in sent_norm:
                  continue
              researched.append(lead)
              existing_brands.add(brand)
              existing_domains.add(domain)
              added.append(lead.get('brand_name'))

          researched_path.write_text(json.dumps(researched, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('ADDED:', ', '.join(added) if added else 'none')
          PY
      - name: Commit merged researched inventory
        run: |
          git config user.name "sponsor-discovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/researched_sponsors.json
          if git diff --cached --quiet; then
            echo "No new verified sponsor candidates to merge."
            exit 0
          fi
          git commit -m "Merge verified sponsor discovery candidates [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
