name: Manual Research Sponsor Top-Up

on:
  push:
    branches:
      - main
    paths:
      - ".github/research-topup-trigger"

permissions:
  contents: write

concurrency:
  group: sponsor-lead-queue
  cancel-in-progress: true

jobs:
  research-only-topup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build queue from manual research only
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CREATORDB_API_KEY: ""
          SPONSOR_MIN_LEAD_SCORE: ${{ vars.SPONSOR_MIN_LEAD_SCORE || '70' }}
          SPONSOR_MAX_AGE_DAYS: ${{ vars.SPONSOR_MAX_AGE_DAYS || '30' }}
          SPONSOR_SEARCH_REGION: ${{ vars.SPONSOR_SEARCH_REGION || 'US' }}
          SPONSOR_SEARCH_LANGUAGE: ${{ vars.SPONSOR_SEARCH_LANGUAGE || 'en' }}
        shell: bash
        run: |
          echo '[]' > data/sponsor_queue.json
          PYTHONPATH=src python -c "import run_sponsor_discovery_batch as m; m.BACKUP_QUEUE_TRIGGER=0; m.run()"
      - name: Persist research-only queue
        run: |
          git config user.name "sponsor-queue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsor_queue.json
          if git diff --cached --quiet; then
            echo "Research queue unchanged."
            exit 0
          fi
          git commit -m "Build research-only sponsor queue [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
