name: Manual Energy Drink Monday Batch

on:
  push:
    branches:
      - main
    paths:
      - "data/manual_energy_drink_batch.json"
      - "src/run_manual_energy_drink_monday_batch.py"
      - ".github/workflows/manual-energy-drinks-monday.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sponsor-lead-queue
  cancel-in-progress: false

jobs:
  import-energy-drinks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Create Monday-only energy drink outreach leads
        env:
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          SPONSOR_MONDAY_BOARD_ID: ${{ vars.SPONSOR_MONDAY_BOARD_ID || '18424367188' }}
          SPONSOR_MONDAY_GROUP_ID: ${{ vars.SPONSOR_MONDAY_GROUP_ID || 'topics' }}
        run: python src/run_manual_energy_drink_monday_batch.py
      - name: Persist duplicate ledger and import result
        if: always()
        run: |
          if git status --porcelain -- data/sent_sponsor_keys.json data/manual_energy_drink_batch_result.json | grep -q .; then
            git config user.name "sponsor-queue-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/sent_sponsor_keys.json data/manual_energy_drink_batch_result.json
            git commit -m "Record manual energy drink Monday batch [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No manual batch state changes to persist."
          fi
