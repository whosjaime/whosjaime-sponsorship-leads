name: First Live Sponsor Test

on:
  push:
    branches: [main]

concurrency:
  group: sponsor-lead-scanner
  cancel-in-progress: false

jobs:
  first-live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate scanner
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_sponsor_*.py'
      - name: Run one-brand live test
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPONSOR_MONDAY_TOKEN: ${{ secrets.SPONSOR_MONDAY_TOKEN }}
          SPONSOR_MONDAY_API_KEY: ${{ secrets.SPONSOR_MONDAY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPONSOR_MONDAY_BOARD_ID: "18424367188"
          SPONSOR_MONDAY_GROUP_ID: "topics"
          SPONSOR_TARGET_DAILY_LEADS: "1"
          SPONSOR_MIN_LEAD_SCORE: "70"
          SPONSOR_SEARCH_REGION: "US"
          SPONSOR_SEARCH_LANGUAGE: "en"
          ENABLE_INSTAGRAM_SPONSOR_SCAN: "false"
          ENABLE_TIKTOK_SPONSOR_SCAN: "false"
        run: python src/run_sponsor_scan.py
